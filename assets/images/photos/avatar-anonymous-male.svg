    <circle cx="200" cy="165" r="48" />
    <!-- Shoulders / Body -->
    <path d="M110 320 C110 245 150 225 200 225 C250 225 290 245 290 320 Z" />
    <!-- Traditional Sash / Kamen Accent -->
