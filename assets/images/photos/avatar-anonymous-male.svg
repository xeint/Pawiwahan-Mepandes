  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <!-- Balinese Motif Silhouette Male -->
  <g fill="#8c6f55" opacity="0.85" transform="translate(0, 10)">
