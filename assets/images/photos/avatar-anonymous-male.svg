    <path d="M160 115 C175 90 225 90 240 115 C255 125 245 140 200 135 C155 140 145 125 160 115 Z" fill="url(#goldGrad)"/>
    <path d="M195 90 C198 70 202 70 205 90 Z" fill="url(#goldGrad)"/>
